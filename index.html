<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나에게 맞는 차 찾기</title>
<style>
:root{--bg:#fcf9f1;--card:#fffefa;--ink:#2d3a2e;--sub:#6b7a69;--accent:#5a8a54;--line:#ede6d5;--hero:#f3eedd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a342a;--card:#354035;--ink:#f1f3ea;--sub:#b3bfb0;--accent:#9acb90;--line:#4a594a;--hero:#2f3a2f}}
:root[data-theme="dark"]{--bg:#2a342a;--card:#354035;--ink:#f1f3ea;--sub:#b3bfb0;--accent:#9acb90;--line:#4a594a;--hero:#2f3a2f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;font-size:14px;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.65}
section{padding:56px 20px}
.in{max-width:980px;margin:0 auto}
.hero{background:var(--hero);padding:72px 20px}
.hero .in{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
h1{font-size:clamp(34px,6vw,56px);line-height:1.15;margin:0 0 16px}
h2{font-size:clamp(20px,3vw,24px);margin:0 0 8px}
p{margin:0 0 16px;color:var(--sub);font-size:15px}
button{font:inherit;cursor:pointer}
.main{padding:13px 26px;border-radius:99px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.opt{display:block;width:100%;text-align:left;padding:15px 18px;margin-bottom:10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
.opt:hover{border-color:var(--accent)}
.card{max-width:680px;margin:28px auto 0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 30px}
.bar{height:8px;background:var(--line);border-radius:4px;margin-bottom:24px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{font-size:19px;font-weight:700;margin:0 0 22px}
.tag{display:inline-block;font-size:12px;padding:4px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:0 6px 6px 0;color:var(--sub)}
.res{text-align:center}.res svg{width:min(240px,70%);height:auto}
.res .big{font-size:30px;font-weight:800;margin:4px 0 10px}
.sub{font-size:12px;letter-spacing:.05em;color:var(--accent);font-weight:700;margin:22px 0 6px}
.mini{display:flex;gap:14px;justify-content:center;margin-top:8px}
.mini div{width:110px;font-size:12px;color:var(--sub)}.mini svg{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:28px}
.t{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center}
.t svg{width:120px;height:120px}.t h3{margin:6px 0 4px;font-size:16px}.t p{font-size:15px;margin:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;text-align:center}.box{border-radius:16px;padding:14px;border:1px solid var(--line);background:var(--bg)}.box.g{border-color:var(--accent)}.box.b{border-color:#c9604d}.box h4{margin:0 0 8px;font-size:13px}.box.g h4{color:var(--accent)}.box.b h4{color:#c9604d}.box p{font-size:12px;margin:8px 0 0}.sn{display:flex;gap:8px;justify-content:center}.sn div{width:72px;font-size:11px;color:var(--ink)}.sn svg{width:100%;height:auto}.share{margin-top:28px;padding:18px;border:1px dashed var(--line);border-radius:16px;text-align:left}.share textarea{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px;resize:none}.btns{display:flex;gap:10px;margin-top:10px}.btns .main{padding:11px 16px;font-size:14px;flex:1}.main.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.ok{font-size:12px;color:var(--accent);min-height:20px;margin:6px 0 0}@media(max-width:520px){.pair{grid-template-columns:1fr}}
body{min-height:100svh;display:flex;align-items:center}
main{width:100%;padding:28px 20px}
.scr{animation:fade .35s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.intro svg{display:block;width:100%;max-width:320px;margin:0 auto}
.nav{display:flex;gap:10px;margin-top:24px}.nav .main{flex:1;padding:13px 10px;font-size:14px}
.card{margin-top:0}
.grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.t{padding:14px}.t svg{width:84px;height:84px}.t p{font-size:12px}
.brew svg g[opacity]{animation:steam 1.6s ease-in-out infinite}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-6px);opacity:.9}}
.dots::after{content:"";animation:dt 1.2s steps(1) infinite}
@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.fill{animation:fl 3s linear forwards}@keyframes fl{from{width:0}to{width:100%}}
@media(max-width:760px){.intro{grid-template-columns:1fr;text-align:center}.intro-nav{margin-left:auto;margin-right:auto}.intro svg{max-width:200px}}
.card.wide{max-width:980px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.wide .mini div{width:84px}.wide .share{margin-top:16px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.res .scene,.scene{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.gw,.pt{transition:transform .9s ease}
.kettle{opacity:0;transition:opacity .5s,transform .8s}.s1 .kettle{opacity:1;transform:rotate(14deg)}
.leaves{transform:none}.s0 .leaves{animation:lf 1.3s ease-in both}
@keyframes lf{from{transform:translateY(-120px);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
.gwa{fill:#bfe3f5;transform:translateY(52px);transition:transform 1.4s ease-out .3s,fill 1.2s ease-in-out .2s}.s2 .gwa,.s3 .gwa,.s4 .gwa{fill:#d9a441}
.s1 .gwa,.s2 .gwa{transform:none}.s3 .gwa{transition-delay:.6s}
.lid{opacity:0;transform:translateY(-40px);transition:opacity .6s,transform .7s ease}.s2 .lid,.s3 .lid,.s4 .lid{opacity:1;transform:none}
.s3 .gw{transform:translate(67px,-40px) rotate(22deg)}.s3 .st2,.s4 .st3{transition-delay:.6s}.s4 .pt{transform:translate(0,-14px) rotate(26deg)}
.pw{transform:scaleY(0);transform-origin:0 22px;transition:transform 1s ease}.s3 .pw{transform:scaleY(1)}.s4 .pw{transform:scaleY(0)}
.cw{transform:translateY(32px);transition:transform 1.2s ease-out .6s}.s4 .cw{transform:none}
.st{opacity:0;transition:opacity .3s}
.s1 .st1,.s3 .st2,.s4 .st3{opacity:.9}@keyframes fw{to{stroke-dashoffset:-20}}
.steam{opacity:0;transition:opacity .5s}.s2 .steam{opacity:1}
.steam path{animation:stm 1.4s ease-in-out infinite}@keyframes stm{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-6px);opacity:.9}}
footer{text-align:center;color:var(--sub);padding:32px 20px 48px;font-size:14px}
@media(max-width:760px){.hero .in{grid-template-columns:1fr;text-align:center}.hero svg{max-width:260px;margin:0 auto}.card{padding:26px 20px}}
</style>
</head>

<main><div class="in" id="app"></div></main>
<script>
const T={
green:{n:"녹차",c:"#9cbf5a",deco:"leaf",d:"깔끔하고 청량한 풀향이 매력이에요. 머리를 맑게 해주고 산뜻한 하루를 열어줘요.",s:"깔끔하고 산뜻한 맛",tags:["카페인 약간","깔끔","아침·식후"],tip:"70~80℃ 물에 1~2분만 우려야 쓴맛 없이 맛있어요."},

function sn(a){return '<div class="sn">'+a.map(k=>`<div><svg viewBox="0 0 60 60" role="img" aria-label="${SN[k][0]}">${SN[k][1]}</svg>${SN[k][0]}</div>`).join('')+'</div>'}
